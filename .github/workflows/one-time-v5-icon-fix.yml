name: One-time V5 icon compatibility fix

on:
  push:
    paths:
      - '.github/workflows/one-time-v5-icon-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace unsupported Flutter icon
        run: |
          sed -i 's/Icons\.clinical_notes_outlined/Icons.description_outlined/g' lib/v5_app.dart
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/v5_app.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Fix V5 Flutter icon compatibility'
            git push
          fi

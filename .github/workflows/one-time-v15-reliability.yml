name: One-time V15 reliability localization and header fixes

on:
  push:
    paths:
      - '.github/workflows/one-time-v15-reliability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V15 reliability patch
        run: python3 tools/patch_v15_reliability.py
      - name: Commit V15 changes
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/i18n/vet_locale.dart lib/v5_app.dart lib/services/vet_backend.dart lib/startup/vet_startup_experience.dart lib/support/support_chat_v6.dart pubspec.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'Fix device locale header email metadata and image tools'
            git push
          fi

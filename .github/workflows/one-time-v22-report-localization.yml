name: One-time V22 report localization

on:
  push:
    paths:
      - 'tools/patch_v22_report_localization.py'
      - '.github/workflows/one-time-v22-report-localization.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vet-ai-v22-report-localization
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply V22 patch
        run: python tools/patch_v22_report_localization.py

      - name: Format Dart files
        run: dart format lib/v5_app.dart lib/analysis/vet_analysis_report.dart lib/reports/vet_pdf_report.dart

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Commit V22
        run: |
          git config user.name "vet-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/v5_app.dart lib/analysis/vet_analysis_report.dart lib/reports/vet_pdf_report.dart supabase/functions/finalize-case-report/index.ts pubspec.yaml
          if git diff --cached --quiet; then
            echo "No V22 changes to commit"
            exit 0
          fi
          git commit -m "V22 localize reports enlarge PDF and approved animal icons"
          git push origin HEAD:main

name: One-time V19 password recovery

on:
  push:
    paths:
      - '.github/workflows/one-time-v19-password-recovery.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply V19 password recovery patch
        run: python3 tools/patch_v19_password_recovery.py
      - name: Get dependencies
        run: flutter pub get
      - name: Verify static analysis
        run: flutter analyze --no-fatal-infos
      - name: Commit verified V19 password recovery
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/v5_app.dart lib/services/vet_backend.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Add V19 password recovery flow'
            git pull --rebase origin main
            git push
          fi

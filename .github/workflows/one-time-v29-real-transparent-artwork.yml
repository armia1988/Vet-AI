name: One-time Vet AI 0.6.29 real transparent artwork

on:
  push:
    branches: [v29-real-transparent-artwork]
    paths:
      - 'tools/v29_transparent_art_bundle.zip'
      - 'tools/patch_v29_real_transparent_artwork.py'
      - '.github/workflows/one-time-v29-real-transparent-artwork.yml'

permissions:
  contents: write

concurrency:
  group: vet-ai-v29-real-transparent-artwork
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: v29-real-transparent-artwork
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Apply real transparent approved artwork
        run: python3 tools/patch_v29_real_transparent_artwork.py

      - name: Format Dart
        run: dart format lib/v5_app.dart

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Verify transparent artwork package
        run: python3 tools/verify_v29_transparent_artwork.py

      - name: Make historical voice patch UI-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/patch_v36_voice_artwork.py')
          s = p.read_text(encoding='utf-8')
          # Keep the old file for its audio fixes only. Its 0.6.24 artwork
          # selectors were superseded by the approved transparent sprite UI.
          s = s.replace(
              "elif \"_DogBreedAvatar(code: breed.code)\" not in app:\n    raise SystemExit('0.6.24 breed patch: repeated dog emoji avatar not found')",
              "elif \"_DogBreedAvatar(code: breed.code)\" not in app:\n    pass",
          )
          s = s.replace(
              'if "class _DogBreedAvatar extends StatelessWidget" not in app:',
              'if False:',
          )
          s = s.replace(
              'if "class _SpeciesChipAvatar extends StatelessWidget" not in app:',
              'if False:',
          )
          s = s.replace(
              'if "_DogBreedAvatar(code: breed.code)" not in app_check:',
              'if False:',
          )
          s = s.replace(
              'if "_SpeciesChipAvatar(code: item.code" not in app_check:',
              'if False:',
          )
          s = s.replace(
              "for display in ('livestock_display.png', 'poultry_display.png', 'dog_display.png'):",
              'for display in ():',
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify build-time hotfix cannot regress artwork
        run: |
          # Old 0.6.24 source PNGs were damaged. Keep valid transparent copies
          # so the historical voice script remains harmless and repeatable.
          cp assets/icons/livestock_group_transparent.png assets/icons/livestock_final.png
          cp assets/icons/birds_group_transparent.png assets/icons/poultry_final.png
          cp assets/icons/dogs_group_transparent.png assets/icons/dog_final.png
          python3 tools/patch_v36_voice_artwork.py
          python3 tools/patch_v37_egyptian_voice.py
          python3 tools/force_voice_playback.py
          python3 tools/patch_v40_voice_pipeline.py
          python3 tools/patch_v41_instant_voice_prewarm.py
          python3 tools/verify_v29_transparent_artwork.py
          dart format lib/v5_app.dart
          flutter analyze

      - name: Commit verified release to main
        run: |
          rm -f tools/v29_transparent_art_bundle.zip
          rm -f tools/patch_v29_real_transparent_artwork.py
          rm -f .github/workflows/one-time-v29-real-transparent-artwork.yml
          git add -A
          git config user.name "vet-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Vet AI 0.6.29 restore real transparent approved artwork"
          git push origin HEAD:main

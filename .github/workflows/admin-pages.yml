name: Deploy Vet AI Admin Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/admin/**'
      - 'lib/support/**'
      - 'lib/main_v2.dart'
      - 'lib/services/**'
      - 'lib/i18n/**'
      - 'lib/v5_app.dart'
      - 'tools/patch_v49_admin_compile_cleanup.py'
      - 'tools/patch_v50_admin_chat_accounts_sensors.py'
      - 'tools/patch_v51_file_picker_compile.py'
      - 'tools/patch_v52_web_chat_company_scroll.py'
      - 'tools/patch_v53_support_operations_import.py'
      - 'tools/patch_v54_native_webrtc_calls.py'
      - 'tools/patch_v55_whatsapp_rich_chat_profiles.py'
      - 'tools/patch_v56_webrtc_audio_hangup.py'
      - 'tools/patch_v57_camera_switch_drag_preview.py'
      - 'tools/patch_v58_ios_safari_camera_flip.py'
      - 'tools/patch_v59_call_smoothing_whatsapp_icons.py'
      - 'tools/patch_v60_instant_camera_flip_black_off.py'
      - 'tools/patch_v61b_admin_instant_navigation.py'
      - 'tools/patch_v62b_admin_accounts_animals_sensors.py'
      - 'tools/patch_v62c_company_manager_routes.py'
      - 'tools/patch_v63d_admin_mobile_accounts_profile_reports.py'
      - 'tools/patch_v63e_profile_metadata_nullsafe.py'
      - 'tools/patch_v64*.py'
      - 'tools/patch_v65*.py'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/admin-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vet-ai-admin-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate web project
        run: flutter create . --platforms=web --project-name app --org com.vetai
      - name: Apply Vet AI generated-source cleanup
        run: |
          python3 tools/patch_v49_admin_compile_cleanup.py
          python3 tools/patch_v50_admin_chat_accounts_sensors.py
          python3 tools/patch_v51_file_picker_compile.py
          python3 tools/patch_v52_web_chat_company_scroll.py
          python3 tools/patch_v53_support_operations_import.py
          python3 tools/patch_v54_native_webrtc_calls.py
          python3 tools/patch_v55_whatsapp_rich_chat_profiles.py
          python3 tools/patch_v56_webrtc_audio_hangup.py
          python3 tools/patch_v57_camera_switch_drag_preview.py
          python3 tools/patch_v58_ios_safari_camera_flip.py
          python3 tools/patch_v59_call_smoothing_whatsapp_icons.py
          python3 tools/patch_v60_instant_camera_flip_black_off.py
          python3 tools/patch_v61b_admin_instant_navigation.py
          python3 tools/patch_v62b_admin_accounts_animals_sensors.py
          python3 tools/patch_v62c_company_manager_routes.py
          python3 tools/patch_v63d_admin_mobile_accounts_profile_reports.py
          python3 tools/patch_v63e_profile_metadata_nullsafe.py
      - name: Get dependencies
        run: flutter pub get
      - name: Build production admin web
        run: flutter build web --release -t lib/main_v2.dart --base-href '/Vet-AI/'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

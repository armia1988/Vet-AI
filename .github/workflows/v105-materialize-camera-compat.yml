name: V105 Materialize Camera Compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/patch_v105_camera_connection_compat.py'
      - 'tools/patch_v105b_camera_onboarding_truthful.py'
      - '.github/workflows/v105-materialize-camera-compat.yml'

permissions:
  contents: write

concurrency:
  group: v105-materialize-camera-compat
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V105 connection compatibility
        run: python3 tools/patch_v105_camera_connection_compat.py
      - name: Apply V105b truthful onboarding
        run: python3 tools/patch_v105b_camera_onboarding_truthful.py
      - name: Basic source verification
        run: |
          grep -q "_rtspCandidateUris" lib/monitoring/camera_connection_service.dart
          grep -q "MD5-SESS" lib/monitoring/camera_connection_service.dart
          grep -q "verifiedOnvif" lib/monitoring/dahua_thermal_camera_onboarding_page.dart
          grep -q "serial_number" lib/monitoring/dahua_thermal_camera_onboarding_page.dart
      - name: Commit materialized camera source
        run: |
          if git diff --quiet -- lib/monitoring/camera_connection_service.dart lib/monitoring/dahua_thermal_camera_onboarding_page.dart; then
            echo "V105 source already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/monitoring/camera_connection_service.dart lib/monitoring/dahua_thermal_camera_onboarding_page.dart
          git commit -m "Materialize V105 camera connection compatibility"
          git push origin HEAD:main

name: One-time support UI patch

on:
  push:
    paths:
      - '.github/workflows/one-time-support-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch support UI
        run: python3 tools/patch_support_ui.py
      - name: Commit support UI patch
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/v5_app.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate rich support chat UI'
            git push
          fi

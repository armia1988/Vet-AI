name: One-time V9 language bootstrap

on:
  push:
    paths:
      - '.github/workflows/one-time-v9-language-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply language bootstrap patch
        run: python3 tools/patch_v9_language_bootstrap.py
      - name: Commit language bootstrap
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/i18n/vet_locale.dart lib/v5_app.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare device language before rendering UI'
            git push
          fi

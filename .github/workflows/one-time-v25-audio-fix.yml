name: One-time V25 audio fix

on:
  push:
    branches:
      - v25-audio-fix
    paths:
      - tools/patch_v25_audio.py
      - .github/workflows/one-time-v25-audio-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v25-audio-fix
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply V25 audio patch
        run: python3 tools/patch_v25_audio.py

      - name: Format Dart files
        run: dart format lib/analysis/vet_analysis_report.dart

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Verify V25 markers
        run: |
          grep -q "version: 0.6.11+23" pubspec.yaml
          grep -q "const \['ar-EG', 'ar-SA', 'ar'\]" lib/analysis/vet_analysis_report.dart
          grep -q "Gemini Developer API TTS auto-detects" supabase/functions/case-voice/index.ts
          if grep -q "languageCode: languageCode(language)" supabase/functions/case-voice/index.ts; then
            echo "Unsupported Gemini TTS languageCode is still present"
            exit 1
          fi

      - name: Commit V25
        run: |
          git config user.name "vet-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/analysis/vet_analysis_report.dart supabase/functions/case-voice/index.ts pubspec.yaml pubspec.lock
          git diff --cached --quiet && exit 0
          git commit -m "Fix Arabic voice playback and Gemini TTS request"
          git push origin HEAD:v25-audio-fix

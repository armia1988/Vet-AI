name: One-time V26 speed consistency audio

on:
  push:
    branches:
      - v26-speed-consistency-audio
    paths:
      - '.github/workflows/one-time-v26-speed-consistency-audio.yml'
      - 'tools/patch_v26_speed_consistency_audio.py'
      - 'tools/patch_v26b_type_auth_fix.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v26-speed-consistency-audio

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply V26 patch
        run: |
          python3 tools/patch_v26_speed_consistency_audio.py
          python3 tools/patch_v26b_type_auth_fix.py

      - name: Remove preparation markers
        run: rm -f tools/_v26_branch_marker.tmp tools/_note_v26.txt tools/_cleanup_note.txt

      - name: Format Dart
        run: dart format lib/v5_app.dart lib/analysis/vet_analysis_report.dart lib/services/vet_case_workflow.dart

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Check Edge Functions
        run: |
          deno check supabase/functions/analyze-case/index.ts
          deno check supabase/functions/finalize-case-report/index.ts
          deno check supabase/functions/case-voice/index.ts

      - name: Verify V26 markers
        run: |
          grep -q 'version: 0.6.12+24' pubspec.yaml
          grep -q 'input_fingerprint' supabase/functions/analyze-case/index.ts
          grep -q 'ar-XA-Chirp3-HD-Sulafat' supabase/functions/case-voice/index.ts
          grep -q 'GOOGLE_CLOUD_TTS_SERVICE_ACCOUNT_JSON' supabase/functions/case-voice/index.ts
          grep -q '_speechSafeText' lib/analysis/vet_analysis_report.dart

      - name: Commit V26
        run: |
          git config user.name "vet-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "V26 speed up scans stabilize diagnoses and fix voice"
          git push origin HEAD:v26-speed-consistency-audio

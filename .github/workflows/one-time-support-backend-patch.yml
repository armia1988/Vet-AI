name: One-time support backend patch

on:
  push:
    paths:
      - '.github/workflows/one-time-support-backend-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch support backend
        run: python3 tools/patch_support_backend.py
      - name: Commit backend patch
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/services/vet_backend.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Add private support attachment backend'
            git push
          fi

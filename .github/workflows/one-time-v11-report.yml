name: One-time V11 report UI patch

on:
  push:
    paths:
      - '.github/workflows/one-time-v11-report.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V11 report patch
        run: python3 tools/patch_v11_report.py
      - name: Commit report UI integration
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/analysis/vet_analysis_report.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate localized final report PDF and natural voice'
            git push
          fi

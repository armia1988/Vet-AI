name: One-time Vet AI 0.6.25 animal scan UI fix

on:
  push:
    branches:
      - v25-animal-scan-ui-fix
    paths:
      - '.github/workflows/one-time-v42-animal-scan-ui.yml'
      - 'tools/patch_v42_animal_scan_ui.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: v25-animal-scan-ui-fix

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Apply animal scan artwork fix
        run: python3 tools/patch_v42_animal_scan_ui.py

      - name: Format Dart
        run: dart format lib/v5_app.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Verify release markers
        run: |
          grep -q 'version: 0.6.25+37' pubspec.yaml
          grep -q "assets/icons/livestock_final.png" lib/v5_app.dart
          grep -q "assets/icons/cow.svg" lib/v5_app.dart
          grep -q 'width: 42, height: 42' lib/v5_app.dart
          grep -q 'width: 172' lib/v5_app.dart

      - name: Commit verified fix
        run: |
          git config user.name "vet-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/v5_app.dart pubspec.yaml pubspec.lock
          git diff --cached --quiet && exit 0
          git commit -m "Vet AI 0.6.25 fix scan animal artwork visibility and size"
          git push origin HEAD:v25-animal-scan-ui-fix

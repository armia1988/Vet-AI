name: One-time V17 static cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-v17-static-cleanup.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply V17 cleanup
        run: python3 tools/patch_v17_static_cleanup.py
      - name: Get dependencies
        run: flutter pub get
      - name: Verify static analysis
        run: flutter analyze
      - name: Commit verified cleanup
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/v5_app.dart lib/legal/vet_legal_pages.dart lib/monitoring/sensor_alert_rules.dart lib/services/vet_operations.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Fix V17 static analysis warnings'
            git push
          fi

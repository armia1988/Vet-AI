name: Install final approved animal icons

on:
  push:
    paths:
      - '.github/workflows/one-time-final-icons.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install approved PNG icons
        run: python3 tools/install_final_icons.py
      - name: Commit final icons
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add assets/icons/livestock_final.png assets/icons/dog_final.png assets/icons/poultry_final.png lib/v5_app.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Use final approved livestock dog and poultry icons'
            git push
          fi

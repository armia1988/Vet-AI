name: iOS CallKit Compile Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/patch_v66*.py'
      - 'tools/patch_v67*.py'
      - 'tools/patch_v68*.py'
      - 'tools/patch_v69*.py'
      - 'tools/patch_v70*.py'
      - 'tools/patch_v71*.py'
      - 'tools/patch_v72*.py'
      - 'tools/patch_v73*.py'
      - 'tools/patch_v74*.py'
      - 'tools/patch_v75*.py'
      - 'tools/patch_v76*.py'
      - 'tools/patch_v77*.py'
      - 'assets/audio/**'
      - 'pubspec.yaml'
      - 'lib/services/callkit_service.dart'
      - 'lib/services/alert_notification_service.dart'
      - 'lib/support/**'
      - 'supabase/functions/support-call-*/**'
      - 'supabase/functions/customer-support-push/**'
      - '.github/workflows/ios-callkit-check.yml'

concurrency:
  group: ios-callkit-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-no-sign:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native projects
        run: |
          flutter create . --platforms=ios,android --project-name app --org com.vetai
          rm -f test/widget_test.dart
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Vet AI uses the camera for veterinary assessment and support video calls.'" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Vet AI uses the microphone for support voice and video calls.'" ios/Runner/Info.plist || true
          sed -i '' "/target 'Runner' do/a\\
            use_frameworks!
          " ios/Podfile
      - name: Apply production patch chain
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 tools/patch_v37_egyptian_voice.py
          python3 tools/force_voice_playback.py
          python3 tools/patch_v40_voice_pipeline.py
          python3 tools/patch_v41_instant_voice_prewarm.py
          python3 tools/patch_v43_eu_legal_pages.py
          python3 tools/patch_v44_apns_push.py
          python3 tools/patch_v45_apns_bridge_reliability.py
          python3 tools/patch_v46_apns_uiscene_bridge.py
          python3 tools/patch_v47_custom_alert_sounds.py
          python3 tools/patch_v48_verified_custom_alert_sounds.py
          python3 tools/patch_v49_admin_compile_cleanup.py
          python3 tools/patch_v50_admin_chat_accounts_sensors.py
          python3 tools/patch_v51_file_picker_compile.py
          python3 tools/patch_v52_web_chat_company_scroll.py
          python3 tools/patch_v53_support_operations_import.py
          python3 tools/patch_v54_native_webrtc_calls.py
          python3 tools/patch_v55_whatsapp_rich_chat_profiles.py
          python3 tools/patch_v56_webrtc_audio_hangup.py
          python3 tools/patch_v57_camera_switch_drag_preview.py
          python3 tools/patch_v58_ios_safari_camera_flip.py
          python3 tools/patch_v59_call_smoothing_whatsapp_icons.py
          python3 tools/patch_v60_instant_camera_flip_black_off.py
          python3 tools/patch_v61b_admin_instant_navigation.py
          python3 tools/patch_v62b_admin_accounts_animals_sensors.py
          python3 tools/patch_v62c_company_manager_routes.py
          python3 tools/patch_v63d_admin_mobile_accounts_profile_reports.py
          python3 tools/patch_v63e_profile_metadata_nullsafe.py
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Verify V67-V77 call and chat reliability fixes
        run: |
          grep -q "senderClientId: endpointId" lib/support/support_webrtc_call_page.dart
          grep -q "await Helper.switchCamera(oldTracks.first);" lib/support/support_webrtc_call_page.dart
          ! grep -q "Camera switch was not completed" lib/support/support_webrtc_call_page.dart
          grep -q "_attachStreamlessRemoteTrack(event.track)" lib/support/support_webrtc_call_page.dart
          grep -q "remoteFallbackStream" lib/support/support_webrtc_call_page.dart
          grep -q "dart.library.html" lib/support/support_chat_sound.dart
          grep -q "BytesSource(_sendBytes)" lib/support/support_chat_sound_native.dart
          grep -q "html.AudioElement" lib/support/support_chat_sound_web.dart
          grep -q "data:audio/wav;base64" lib/support/support_chat_sound_web.dart
          grep -q "vet_ai_call_outgoing.wav" lib/support/support_call_tone.dart
          grep -q 'ringtoneSound = "vet_ai_incoming_call.caf"' ios/Runner/AppDelegate.swift
          grep -q "AudioRecorder" lib/support/support_voice_note.dart
          grep -q "message_type': 'audio'" lib/support/support_voice_note.dart
          grep -q "VOICE_RECORDING_TOO_SHORT" lib/support/support_voice_note.dart
          grep -q "noiseFloor = 0.010" lib/support/support_voice_note.dart
          grep -q "_compressedWaveform" lib/support/support_voice_note.dart
          grep -q "'waveform': clip.waveform" lib/support/support_voice_note.dart
          grep -q "BytesSource(bytes)" lib/support/support_voice_note.dart
          grep -q "downloadSupportAttachment(path)" lib/support/support_voice_note.dart
          grep -q "cachedAudioBytes" lib/support/support_voice_note.dart
          grep -q "ValueNotifier<double> level" lib/support/support_voice_note.dart
          grep -q "onPositionChanged" lib/support/support_voice_note.dart
          grep -q "onDurationChanged" lib/support/support_voice_note.dart
          grep -q "Future<void> pause()" lib/support/support_voice_note.dart
          grep -q "Future<void> resume()" lib/support/support_voice_note.dart
          grep -q "ValueListenable<double> level" lib/support/support_voice_recorder_bar.dart
          grep -q "List<double>.filled(46, 0)" lib/support/support_voice_recorder_bar.dart
          grep -q "height: value == 0 ? 2.2" lib/support/support_voice_recorder_bar.dart
          grep -q "Icons.pause_rounded" lib/support/support_voice_recorder_bar.dart
          grep -q "Icons.delete_outline_rounded" lib/support/support_voice_recorder_bar.dart
          grep -q "Icons.send_rounded" lib/support/support_voice_recorder_bar.dart
          grep -q "level: voiceRecorder.level" lib/support/support_chat_v6.dart
          grep -q "level: voiceRecorder.level" lib/support/support_agent_thread_v2.dart
          grep -q "mine ? Alignment.centerRight : Alignment.centerLeft" lib/support/support_chat_v6.dart
          grep -q "mine ? Alignment.centerRight : Alignment.centerLeft" lib/support/support_agent_thread_v2.dart
          grep -q "widthFactor: 1" lib/support/support_agent_thread_v2.dart
          grep -q "resizeToAvoidBottomInset: false" lib/support/support_chat_v6.dart
          grep -q "resizeToAvoidBottomInset: false" lib/support/support_agent_thread_v2.dart
          grep -q "scrollPadding: EdgeInsets.zero" lib/support/support_agent_thread_v2.dart
          grep -q "iceCandidatePoolSize': 2" lib/support/support_webrtc_call_page.dart
          grep -q "'ideal': 640" lib/support/support_webrtc_call_page.dart
          grep -q "from('support_messages')" lib/support/support_incoming_call_overlay.dart
          grep -q "playReceiveFor(id)" lib/support/support_incoming_call_overlay.dart
          grep -q "VetSupportChatNotice.show" lib/support/support_incoming_call_overlay.dart
          grep -q "AppLifecycleState.resumed" lib/services/alert_notification_service.dart
          grep -q "AppLifecycleState.resumed" lib/services/callkit_service.dart
          ! sed -n '/String _statusText/,/class _WaitingView/p' lib/support/support_webrtc_call_page.dart | grep -q 'STUN'
          ! sed -n '/String _statusText/,/class _WaitingView/p' lib/support/support_webrtc_call_page.dart | grep -q 'TURN'
          grep -q "adminAccessResolved" lib/admin/admin_dashboard.dart
          grep -q "_fallbackCapabilitiesForRole" lib/admin/admin_dashboard.dart
          python3 - <<'PY'
          from pathlib import Path
          checks = [
              ('lib/support/support_chat_v6.dart', '  Future<void> _sendText() async {', '  Future<bool> _confirmAccess('),
              ('lib/support/support_agent_thread_v2.dart', '  Future<void> _send() async {', '  Future<void> _showAttachmentMenu() async {'),
          ]
          for path, start_marker, end_marker in checks:
              text = Path(path).read_text(encoding='utf-8')
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              method = text[start:end]
              assert 'sending = true' not in method
              assert 'setState(() => sending = true)' not in method
              assert 'VetSupportChatSound.playSend()' in method
              assert 'addPostFrameCallback' not in method
          print('V77 chat/voice/call verification passed')
          PY
      - name: Compile iOS without signing
        run: flutter build ios --release --no-codesign -t lib/main_v2.dart
      - name: Verify CallKit bundle configuration
        run: |
          grep -q 'PKPushRegistryDelegate' ios/Runner/AppDelegate.swift
          grep -q 'CXProviderDelegate' ios/Runner/AppDelegate.swift
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' ios/Runner/Info.plist | grep -q voip
name: Apply V36 source patch

on:
  push:
    branches:
      - fix/v36-profile-icons-alerts-voice

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ !contains(github.event.head_commit.message, '[v36-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v36-profile-icons-alerts-voice
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply source changes
        run: python3 tools/patch_v36_profile_alerts.py
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter sources
        run: flutter analyze --no-fatal-infos
      - name: Verify V36 markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('lib/v5_app.dart').read_text()
          alerts = Path('lib/monitoring/sensor_alert_rules.dart').read_text()
          pub = Path('pubspec.yaml').read_text()
          for marker in [
              '_AnimalGroupMultiSelect', '_DogBreedMultiSelect', 'profileSelectedGroups',
              "dogBreeds: profileSelectedGroups.contains('dogs')", 'item.emoji',
              'VetAlertNotificationService.instance.showSensorAlert',
          ]:
              assert marker in app, marker
          assert "'لا يقل عن'" in alerts and "'لا يزيد عن'" in alerts
          assert 'lo == null || hi == null' in alerts
          assert 'version: 0.6.22+34' in pub
          assert 'flutter_local_notifications:' in pub
          print('V36 markers verified')
          PY
      - name: Commit checked source and remove one-time tooling
        run: |
          rm -f tools/patch_v36_profile_alerts.py .github/workflows/v36-source-apply.yml
          git config user.name "Vet AI CI"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply V36 profile, animal, alert and notification UX [v36-applied]"
          git push origin HEAD:fix/v36-profile-icons-alerts-voice

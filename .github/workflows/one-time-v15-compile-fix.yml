name: Run V15 compile fix

on:
  push:
    paths:
      - '.github/workflows/one-time-v15-compile-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compile fix
        run: python3 tools/patch_v15_compile_fix.py
      - name: Commit compile fix
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/services/vet_backend.dart lib/v5_app.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Fix legacy signup compilation after localized email metadata'
            git push
          fi

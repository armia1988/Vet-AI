name: One-time V16 operational UI patch

on:
  push:
    paths:
      - '.github/workflows/one-time-v16-operations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V16 operational UI patch
        run: python3 tools/patch_v16_operations.py
      - name: Commit operational UI integration
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/v5_app.dart lib/support/support_chat_v6.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate legal hub support console and real sensor alerts'
            git push
          fi

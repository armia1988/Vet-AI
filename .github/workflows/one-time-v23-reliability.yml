name: One-time V23 reliability

on:
  push:
    branches:
      - v23-reliability
    paths:
      - '.github/workflows/one-time-v23-reliability.yml'
      - 'tools/patch_v23_reliability.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v23-reliability

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Apply V23 patch
        run: python3 tools/patch_v23_reliability.py

      - name: Format Dart files
        run: dart format lib/v5_app.dart lib/services/vet_case_workflow.dart lib/analysis/vet_analysis_report.dart

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Commit V23
        run: |
          git config user.name "vet-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/v5_app.dart lib/services/vet_case_workflow.dart lib/analysis/vet_analysis_report.dart pubspec.yaml pubspec.lock
          git diff --cached --quiet && exit 0
          git commit -m "V23 fix scan reliability permissions final report and voice"
          git push origin HEAD:v23-reliability

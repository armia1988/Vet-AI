name: One-time V7 case report integration

on:
  push:
    paths:
      - '.github/workflows/one-time-v7-case-report.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V7 case report patch
        run: python3 tools/patch_v7_case_report.py
      - name: Commit V7 integration
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/v5_app.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate spoken interactive final veterinary reports'
            git push
          fi

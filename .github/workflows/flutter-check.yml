name: Flutter Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**'
      - 'android/**'
      - 'supabase/functions/**'
      - 'codemagic.yaml'
      - '.github/workflows/flutter-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**'
      - 'android/**'
      - 'supabase/functions/**'
      - 'codemagic.yaml'
      - '.github/workflows/flutter-check.yml'

concurrency:
  group: flutter-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Vet AI Edge Functions
        run: |
          deno check supabase/functions/analyze-case/index.ts
          deno check supabase/functions/finalize-case-report/index.ts
          deno check supabase/functions/case-voice/index.ts

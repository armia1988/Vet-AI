name: Flutter Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**'
      - 'android/**'
      - 'tools/**'
      - 'supabase/functions/**'
      - 'codemagic.yaml'
      - '.github/workflows/flutter-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**'
      - 'android/**'
      - 'tools/**'
      - 'supabase/functions/**'
      - 'codemagic.yaml'
      - '.github/workflows/flutter-check.yml'

concurrency:
  group: flutter-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Apply generated-source cleanup
        run: |
          python3 tools/patch_v49_admin_compile_cleanup.py
          python3 tools/patch_v50_admin_chat_accounts_sensors.py
          python3 tools/patch_v51_file_picker_compile.py
          python3 tools/patch_v52_web_chat_company_scroll.py
          python3 tools/patch_v53_support_operations_import.py
          python3 tools/patch_v54_native_webrtc_calls.py
          python3 tools/patch_v55_whatsapp_rich_chat_profiles.py
          python3 tools/patch_v56_webrtc_audio_hangup.py
          python3 tools/patch_v57_camera_switch_drag_preview.py
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Vet AI Edge Functions
        run: |
          deno check supabase/functions/analyze-case/index.ts
          deno check supabase/functions/finalize-case-report/index.ts
          deno check supabase/functions/case-voice/index.ts
          deno check supabase/functions/admin-push-notification/index.ts
          deno check supabase/functions/admin-support-push/index.ts
          deno check supabase/functions/ingest-sensor-reading/index.ts
          deno check supabase/functions/vet-ai-apns-push/index.ts

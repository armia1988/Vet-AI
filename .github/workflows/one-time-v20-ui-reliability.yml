name: One-time V20 UI reliability

on:
  push:
    paths:
      - '.github/workflows/one-time-v20-ui-reliability.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply V20 UI reliability patch
        run: python3 tools/patch_v20_ui_reliability.py
      - name: Get dependencies
        run: flutter pub get
      - name: Verify static analysis
        run: flutter analyze --no-fatal-infos
      - name: Commit verified V20 patch
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/v5_app.dart lib/monitoring/sensor_alert_rules.dart lib/monitoring/smart_home_vitals.dart pubspec.yaml pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m 'Fix V20 AI retries alerts sensors and icon sizing'
            git pull --rebase origin main
            git push
          fi

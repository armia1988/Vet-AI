name: One-time V6 UI patch

on:
  push:
    paths:
      - '.github/workflows/one-time-v6-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add pre-login language button
        run: python3 tools/patch_auth_language_button.py
      - name: Commit language selector
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/v5_app.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Add language selector before sign in'
            git push
          fi

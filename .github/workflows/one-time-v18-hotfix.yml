name: One-time V18 icons AI header hotfix

on:
  push:
    branches:
      - fix-v18-icons-ai-header
    paths:
      - '.github/workflows/one-time-v18-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-v18-icons-ai-header
      - name: Apply V18 hotfix
        run: python3 tools/patch_v18_icons_ai_header.py
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Commit verified hotfix
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          rm -f .github/workflows/one-time-v18-hotfix.yml tools/patch_v18_icons_ai_header.py
          git add lib/v5_app.dart pubspec.yaml .github/workflows/one-time-v18-hotfix.yml tools/patch_v18_icons_ai_header.py
          git commit -m 'Fix V18 animal icons header and AI retry reliability'
          git push origin HEAD:fix-v18-icons-ai-header

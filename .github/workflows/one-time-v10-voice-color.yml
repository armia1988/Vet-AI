name: One-time V10 voice color patch

on:
  push:
    paths:
      - '.github/workflows/one-time-v10-voice-color.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply voice and color patch
        run: python3 tools/patch_v10_voice_color.py
      - name: Commit voice and color changes
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/analysis/vet_analysis_report.dart lib/v5_app.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Improve automatic voice summary and colorful navigation'
            git push
          fi

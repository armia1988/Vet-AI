name: One-time V25 deploy case voice

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-v25-deploy-case-voice.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase deployment token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions secrets."
            exit 2
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy case-voice
        run: supabase functions deploy case-voice --project-ref mzqwjyantyvizwbzetwf

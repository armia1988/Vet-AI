name: V35 Source Patch

on:
  push:
    branches:
      - feat/v35-species-hardware-alerts
    paths:
      - tools/apply_v35_species_voice.py
      - lib/monitoring/**
      - lib/models/**
      - lib/services/vet_operations.dart
      - .github/workflows/v35-source-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v35-species-hardware-alerts
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply V35 source patch
        run: python3 tools/apply_v35_species_voice.py
      - name: Flutter dependencies
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: Check Edge Functions
        run: |
          deno check supabase/functions/analyze-case/index.ts
          deno check supabase/functions/finalize-case-report/index.ts
          deno check supabase/functions/case-voice/index.ts
      - name: Verify V35 markers
        run: |
          grep -q "speciesCode: speciesCode" lib/v5_app.dart
          grep -q "vet_ai_exact_scan_v3" lib/v5_app.dart
          grep -q "selected_species:selectedSpecies" supabase/functions/analyze-case/index.ts
          grep -q "voice_client_events" lib/services/vet_operations.dart
          grep -q "oxygen_percent" lib/monitoring/smart_home_vitals.dart
          grep -q "SC4-O2" lib/monitoring/sensor_alert_rules.dart
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "Vet AI CI"
          git config user.email "actions@users.noreply.github.com"
          git add lib pubspec.yaml supabase/functions
          git commit -m "Apply V35 species, diagnosis and voice telemetry source changes"
          git push origin HEAD:feat/v35-species-hardware-alerts

name: V100 Materialize Health Center

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v100-materialize-health-center.yml'
      - 'tools/patch_v100_animal_health_center.py'

permissions:
  contents: write

concurrency:
  group: v100-materialize-health-center
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V100 customer navigation
        run: python3 tools/patch_v100_animal_health_center.py
      - name: Verify materialized source
        run: python3 tools/verify_v100_health_management.py
      - name: Commit materialized V100 source
        run: |
          if git diff --quiet -- lib/v5_app.dart; then
            echo "V100 source already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/v5_app.dart
          git commit -m "Materialize V100 farm health center navigation"
          git push origin HEAD:main

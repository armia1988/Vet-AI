name: One-time V13 language and support patch

on:
  push:
    paths:
      - '.github/workflows/one-time-v13-locale-support.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V13 locale support patch
        run: python3 tools/patch_v13_locale_support.py
      - name: Commit reliability changes
        run: |
          git config user.name 'Vet AI Build Bot'
          git config user.email 'actions@github.com'
          git add lib/i18n/vet_locale.dart lib/support/support_chat_v6.dart codemagic.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'Make language switching non-blocking and harden support uploads'
            git push
          fi

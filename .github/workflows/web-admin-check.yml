name: Vet AI Admin Web Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/admin/**'
      - 'lib/support/**'
      - 'lib/main_v2.dart'
      - 'lib/services/alert_notification_service.dart'
      - 'lib/v5_app.dart'
      - 'tools/patch_v49_admin_compile_cleanup.py'
      - 'tools/patch_v50_admin_chat_accounts_sensors.py'
      - 'tools/patch_v51_file_picker_compile.py'
      - 'tools/patch_v52_web_chat_company_scroll.py'
      - 'tools/patch_v53_support_operations_import.py'
      - 'tools/patch_v54_native_webrtc_calls.py'
      - 'tools/patch_v55_whatsapp_rich_chat_profiles.py'
      - 'tools/patch_v56_webrtc_audio_hangup.py'
      - 'tools/patch_v57_camera_switch_drag_preview.py'
      - 'tools/patch_v58_ios_safari_camera_flip.py'
      - 'tools/patch_v59_call_smoothing_whatsapp_icons.py'
      - 'tools/patch_v60_instant_camera_flip_black_off.py'
      - 'tools/patch_v61_admin_instant_navigation.py'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/web-admin-check.yml'

concurrency:
  group: vet-ai-admin-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate web project
        run: flutter create . --platforms=web --project-name app --org com.vetai
      - name: Apply Vet AI generated-source cleanup
        run: |
          python3 tools/patch_v49_admin_compile_cleanup.py
          python3 tools/patch_v50_admin_chat_accounts_sensors.py
          python3 tools/patch_v51_file_picker_compile.py
          python3 tools/patch_v52_web_chat_company_scroll.py
          python3 tools/patch_v53_support_operations_import.py
          python3 tools/patch_v54_native_webrtc_calls.py
          python3 tools/patch_v55_whatsapp_rich_chat_profiles.py
          python3 tools/patch_v56_webrtc_audio_hangup.py
          python3 tools/patch_v57_camera_switch_drag_preview.py
          python3 tools/patch_v58_ios_safari_camera_flip.py
          python3 tools/patch_v59_call_smoothing_whatsapp_icons.py
          python3 tools/patch_v60_instant_camera_flip_black_off.py
          python3 tools/patch_v61_admin_instant_navigation.py
      - name: Get dependencies
        run: flutter pub get
      - name: Build web admin
        run: flutter build web --release -t lib/main_v2.dart
      - name: Upload web admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: vet-ai-admin-web
          path: build/web
          retention-days: 7

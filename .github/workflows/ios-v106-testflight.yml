name: V106 Free GitHub TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - release/v106-testflight

concurrency:
  group: v106-testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.vetai.app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check required signing secrets
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          missing=0
          for key in \
            IOS_DISTRIBUTION_CERTIFICATE_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_BASE64; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the six V106 secrets under GitHub > Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - name: Generate native iOS project and permissions
        run: |
          flutter create . --platforms=ios,android --project-name app --org com.vetai
          rm -f test/widget_test.dart
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Vet AI" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Vet AI uses the camera to capture animal health images for veterinary assessment and support video calls.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Vet AI uses the camera to capture animal health images for veterinary assessment and support video calls.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Vet AI uses selected photos to create veterinary assessment cases.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Vet AI uses selected photos to create veterinary assessment cases.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Vet AI uses the microphone only when you choose to join a support voice or video call.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Vet AI uses the microphone only when you choose to join a support voice or video call.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Vet AI uses your location, after your approval, while you use the app to apply the correct local veterinary guidance and animal-health rules.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'Vet AI uses your location, after your approval, while you use the app to apply the correct local veterinary guidance and animal-health rules.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Vet AI connects to IP cameras on your local network for live monitoring and veterinary alerts.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription 'Vet AI connects to IP cameras on your local network for live monitoring and veterinary alerts.'" ios/Runner/Info.plist
          sed -i '' "/target 'Runner' do/a\\
            use_frameworks!
          " ios/Podfile
          python3 - <<'PY'
          import plistlib
          path = 'ios/Runner/Info.plist'
          with open(path, 'rb') as f:
              data = plistlib.load(f)
          data['CFBundleURLTypes'] = [{
              'CFBundleTypeRole': 'Editor',
              'CFBundleURLName': 'com.vetai.app.auth',
              'CFBundleURLSchemes': ['vetai'],
          }]
          ats = dict(data.get('NSAppTransportSecurity') or {})
          ats['NSAllowsArbitraryLoads'] = True
          data['NSAppTransportSecurity'] = ats
          with open(path, 'wb') as f:
              plistlib.dump(data, f)
          PY

      - name: Apply Vet AI production patch chain
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 tools/patch_v37_egyptian_voice.py
          python3 tools/force_voice_playback.py
          python3 tools/patch_v40_voice_pipeline.py
          python3 tools/patch_v41_instant_voice_prewarm.py
          python3 tools/patch_v43_eu_legal_pages.py
          python3 tools/patch_v44_apns_push.py
          python3 tools/patch_v45_apns_bridge_reliability.py
          python3 tools/patch_v46_apns_uiscene_bridge.py
          python3 tools/patch_v47_custom_alert_sounds.py
          python3 tools/patch_v48_verified_custom_alert_sounds.py
          python3 tools/patch_v49_admin_compile_cleanup.py
          python3 tools/patch_v50_admin_chat_accounts_sensors.py
          python3 tools/patch_v51_file_picker_compile.py
          python3 tools/patch_v52_web_chat_company_scroll.py
          python3 tools/patch_v53_support_operations_import.py
          python3 tools/patch_v54_native_webrtc_calls.py
          python3 tools/patch_v55_whatsapp_rich_chat_profiles.py
          python3 tools/patch_v56_webrtc_audio_hangup.py
          python3 tools/patch_v57_camera_switch_drag_preview.py
          python3 tools/patch_v58_ios_safari_camera_flip.py
          python3 tools/patch_v59_call_smoothing_whatsapp_icons.py
          python3 tools/patch_v60_instant_camera_flip_black_off.py
          python3 tools/patch_v61b_admin_instant_navigation.py
          python3 tools/patch_v62b_admin_accounts_animals_sensors.py
          python3 tools/patch_v62c_company_manager_routes.py
          python3 tools/patch_v63d_admin_mobile_accounts_profile_reports.py
          python3 tools/patch_v63e_profile_metadata_nullsafe.py
          python3 tools/patch_v82_camera_live_digest.py
          python3 tools/patch_v83_professional_camera_center.py
          python3 tools/patch_v84_onvif_network_discovery.py
          python3 tools/patch_v85_onvif_ptz_controls.py
          python3 tools/patch_v87_camera_intelligence.py
          python3 tools/patch_v90_camera_alert_persistence.py
          python3 tools/patch_v91_camera_alert_hardening.py
          python3 tools/patch_v92_camera_alert_center.py
          python3 tools/patch_v93_camera_gateway.py
          python3 tools/patch_v93a_camera_gateway_compile_fix.py
          python3 tools/patch_v95_camera_wall_performance.py
          python3 tools/patch_v95a_materialized_idempotency.py
          python3 tools/patch_v105_camera_connection_compat.py
          python3 tools/patch_v105b_camera_onboarding_truthful.py
          python3 -m py_compile tools/vet_ai_camera_gateway.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Import Apple distribution certificate and provisioning profile
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/vetai_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/vetai_appstore.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/vetai-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Build signed IPA
        shell: bash
        run: |
          APP_VERSION=$(python3 - <<'PY'
          import re
          text = open('pubspec.yaml', encoding='utf-8').read()
          m = re.search(r'^version:\s*([^+\s]+)', text, re.M)
          print(m.group(1) if m else '0.0.0')
          PY
          )
          IOS_BUILD_NUMBER=$((2000 + GITHUB_RUN_NUMBER))

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          echo "Vet AI V106 release: ${APP_VERSION} (${IOS_BUILD_NUMBER})"
          flutter build ipa --release \
            -t lib/main_v2.dart \
            --build-name="$APP_VERSION" \
            --build-number="$IOS_BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -n 1)
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Verify signed IPA
        shell: bash
        run: |
          VERIFY_DIR=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_PATH=$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' | head -n 1)
          test -n "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q "Identifier=${BUNDLE_ID}" "$RUNNER_TEMP/codesign.txt"
          for SOUND in vet_ai_orange_alert.caf vet_ai_red_trtr_alert.caf vet_ai_incoming_call.caf; do
            test -f "$APP_PATH/$SOUND"
          done
          rm -rf "$VERIFY_DIR"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vet-AI-V106-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect / TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

name: app
description: Vet AI - veterinary decision support and smart animal monitoring.
publish_to: 'none'
version: 0.6.7+19

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  image_picker: ^1.2.3
  file_picker: ^12.2.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.3
  audioplayers: ^6.8.1
  geolocator: ^14.0.3
  pdf: ^3.13.0
  printing: ^5.15.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/vet_ai_logo.svg
    - assets/vet_ai_app_icon.svg
    - assets/icons/

flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/vet_ai_app_icon.png
  remove_alpha_ios: true

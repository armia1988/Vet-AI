workflows:
  ios-release:
    name: Vet AI iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Codemagic Key
    environment:
      ios_signing:
        provisioning_profiles:
          - Vet AI App Store
        certificates:
          - active_development # أو اتركها فارغة ليسحب شهادة الـ Distribution المعرفة تلقائياً
    scripts:
      - name: Build iOS App
        script: echo "Building Vet AI for TestFlight..."
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

workflows:
  ios-release:
    name: Vet AI iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: Codemagic Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vetai.app
      flutter: stable
    scripts:
      - name: Generate native iOS and Android projects
        script: |
          flutter create . --platforms=ios,android --project-name app --org com.vetai
          rm -f test/widget_test.dart
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Vet AI" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Vet AI uses the camera to capture animal health images for veterinary assessment.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Vet AI uses the camera to capture animal health images for veterinary assessment.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Vet AI uses selected photos to create veterinary assessment cases.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Vet AI uses selected photos to create veterinary assessment cases.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Vet AI uses your location, after your approval, while you use the app to apply the correct local veterinary guidance and animal-health rules.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'Vet AI uses your location, after your approval, while you use the app to apply the correct local veterinary guidance and animal-health rules.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'Vet AI uses location only after your approval to apply the correct local veterinary guidance and animal-health rules. Vet AI does not continuously track your location in the background.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription 'Vet AI uses location only after your approval to apply the correct local veterinary guidance and animal-health rules. Vet AI does not continuously track your location in the background.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysUsageDescription string 'Vet AI uses location only after your approval to apply the correct local veterinary guidance and animal-health rules. Vet AI does not continuously track your location in the background.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysUsageDescription 'Vet AI uses location only after your approval to apply the correct local veterinary guidance and animal-health rules. Vet AI does not continuously track your location in the background.'" ios/Runner/Info.plist
          sed -i '' "/target 'Runner' do/a\\
            use_frameworks!
          " ios/Podfile
          python3 - <<'PY'
          import plistlib
          path = 'ios/Runner/Info.plist'
          with open(path, 'rb') as f:
              data = plistlib.load(f)
          data['CFBundleURLTypes'] = [{
              'CFBundleTypeRole': 'Editor',
              'CFBundleURLName': 'com.vetai.app.auth',
              'CFBundleURLSchemes': ['vetai'],
          }]
          with open(path, 'wb') as f:
              plistlib.dump(data, f)
          PY

      - name: Apply Vet AI 0.6.24 hotfix
        script: |
          python3 -m pip install --quiet pillow
          python3 tools/patch_v36_voice_artwork.py
          python3 tools/patch_v37_egyptian_voice.py
          python3 tools/force_voice_playback.py
          python3 tools/patch_v40_voice_pipeline.py
          python3 tools/patch_v41_instant_voice_prewarm.py

      - name: Verify production backend and hotfix
        script: |
          python3 - <<'PY'
          from pathlib import Path
          expected_ref = 'mzqwjyantyvizwbzetwf'
          config = Path('lib/config/supabase_config.dart').read_text(encoding='utf-8')
          if expected_ref not in config:
              raise SystemExit('Vet AI production Supabase project guard is missing')
          workflow = Path('lib/services/vet_case_workflow.dart').read_text(encoding='utf-8')
          if 'clean.length > 3600' not in workflow:
              raise SystemExit('Vet AI 0.6.24 full voice length patch is missing')
          report = Path('lib/analysis/vet_analysis_report.dart').read_text(encoding='utf-8')
          required = [
              'DeviceFileSource(voiceFile.path)',
              'device_file_pipeline',
              '_splitVoiceChunks',
              '_buildSpokenReportText()',
              'actions.join',
              'chunks[i + 1]',
              '_egyptianSpeechText(text)',
              '_prewarmCurrentVoice()',
              '_voicePrewarmBytes',
              'voice_prewarm_ready',
              'voice_tap_cache_hit',
              'instant_voice_cache',
              'maxChars: 300',
          ]
          for marker in required:
              if marker not in report:
                  raise SystemExit(f'Vet AI 0.6.24 voice pipeline missing: {marker}')
          if 'BytesSource(natural)' in report:
              raise SystemExit('Vet AI 0.6.24 old BytesSource playback is still active')
          if "String text = (_result['voice_summary']" in report:
              raise SystemExit('Vet AI 0.6.24 old partial voice_summary path is still active')
          print('Vet AI 0.6.24 instant prewarmed Egyptian voice pipeline verified')
          PY

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Generate Vet AI launcher icons
        script: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          source = open('assets/vet_ai_app_icon.svg', encoding='utf-8').read()
          source = source.replace('#07181B', '#181D21').replace('#39E6B1', '#8EB9AF')
          source = source.replace('translate(121 249) scale(3.4)', 'translate(-15 54) scale(4.6)')
          cairosvg.svg2png(
              bytestring=source.encode('utf-8'),
              write_to='assets/vet_ai_app_icon.png',
              output_width=1024,
              output_height=1024,
          )
          PY
          dart run flutter_launcher_icons

      - name: Static analysis
        script: flutter analyze --no-fatal-infos

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build iOS App with unique App Store build number
        script: |
          APP_VERSION=$(python3 - <<'PY'
          import re
          text = open('pubspec.yaml', encoding='utf-8').read()
          m = re.search(r'^version:\s*([^+\s]+)', text, re.M)
          print(m.group(1) if m else '0.0.0')
          PY
          )
          CM_SEQUENCE="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          IOS_BUILD_NUMBER=$((1000 + CM_SEQUENCE))
          echo "Vet AI release: ${APP_VERSION} (${IOS_BUILD_NUMBER})"
          flutter build ipa --release \
            -t lib/main_v2.dart \
            --build-name="${APP_VERSION}" \
            --build-number="${IOS_BUILD_NUMBER}" \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration

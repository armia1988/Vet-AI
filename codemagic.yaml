workflows:
  ios-release:
    name: Vet AI iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Codemagic Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vetai.app
      flutter: stable
    scripts:
      - name: Generate native iOS and Android projects
        script: |
          flutter create . --platforms=ios,android --project-name app --org com.vetai
          rm -f test/widget_test.dart
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS App
        script: |
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
